[package]
name = "dramaai-tiktok-downloader-gui"
version = "1.1.5"
edition = "2021"
description = "DramaAI Tiktok Downloader - native Rust GUI"

[[bin]]
name = "DramaAI-Tiktok-Downloader"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
